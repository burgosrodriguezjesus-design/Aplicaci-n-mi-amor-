# Publicar alicIA en Render, gratis.
#
# Esto es un "Blueprint": Render lee este fichero del repositorio y crea el
# servicio solo, sin instalar nada en tu ordenador. Se puede hacer desde el
# móvil: https://dashboard.render.com → New → Blueprint → elegir este repo.
#
# Por qué la base de datos y los ficheros van fuera:
# ningún plan gratuito —aquí ni en ningún otro sitio— da disco que sobreviva a
# los reinicios. Así que la aplicación no guarda nada en sí misma: la base de
# datos vive en Neon y los PDF en Cloudflare R2, los dos con plan gratuito de
# verdad. Al aplicar el Blueprint, Render te pedirá esos cinco datos.
#
# El paso a paso, con capturas de dónde sacar cada valor, está en
# docs/publicar.md.

services:
  - type: web
    name: estudia
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # ── Base de datos (Neon, plan gratuito) ──────────────────────────
      # La cadena que da Neon, empieza por postgresql://
      - key: DATABASE_URL
        sync: false

      # ── Ficheros (Cloudflare R2, 10 GB gratis) ───────────────────────
      - key: STORAGE_DRIVER
        value: s3
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_REGION
        value: auto

      # Se genera una vez y no cambia: si cambiara, se cerrarían las sesiones.
      - key: AUTH_SECRET
        generateValue: true

      # ── Ajustes para 512 MB de memoria ───────────────────────────────
      # El plan gratuito es pequeño: se reconoce una página a la vez y a menos
      # resolución. Sigue leyendo bien; simplemente tarda más.
      - key: OCR_CONCURRENCY
        value: "1"
      - key: OCR_SCALE
        value: "1.3"
      - key: AI_CONCURRENCY
        value: "2"
      - key: MAX_UPLOAD_MB
        value: "400"
      - key: MAX_PDF_PAGES
        value: "1500"
      - key: OCR_MAX_PAGES
        value: "1500"
